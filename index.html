<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XIMA LOVES JAHRA 💗</title>
  <style>
    body {
      background-color: #ffc0cb;
      font-family: "Comic Sans MS", cursive, sans-serif;
      text-align: center;
      color: white;
      margin: 0;
      padding: 0;
    }

    h1 {
      background: #ff69b4;
      color: white;
      padding: 15px 25px;
      border-radius: 20px;
      margin-top: 25px;
      display: inline-block;
      font-size: 26px;
      box-shadow: 0 0 15px #ff1493;
    }

    .timer-box {
      margin-top: 60px;
      background-color: #ff8fa3;
      display: inline-block;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 0 15px #ff4d88;
    }

    #timer {
      font-size: 22px;
      font-weight: bold;
    }

    /* Stickers */
    .stickers img {
      width: 90px;
      position: absolute;
    }
    .sticker1 { top: 100px; left: 20px; }
    .sticker2 { top: 100px; right: 20px; }
    .sticker3 { bottom: 120px; left: 50%; transform: translateX(-50%); }

    .gallery {
      margin-top: 100px;
      padding: 20px;
    }

    .gallery h2 {
      color: #ff69b4;
      background-color: white;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 15px;
      box-shadow: 0 0 10px #ff4d88;
      font-size: 22px;
    }

    .photos {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    .photos img {
      width: 300px;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 0 10px #ff4d88;
    }
  </style>
</head>
<body>

  <h1>XIMA LOVES JAHRA SM 💞</h1>

  <div class="stickers">
    <!-- Use your own uploaded sticker image URLs -->
    <img src="sticker1.png" class="sticker1" />
    <img src="sticker2.png" class="sticker2" />
    <img src="sticker3.png" class="sticker3" />
  </div>

  <div class="timer-box">
    <div id="timer">Loading love timer...</div>
  </div>

  <div class="gallery">
    <h2>Our Moments 💕</h2>
    <div class="photos">
      <img src="photo1.jpg" alt="moment1" />
      <img src="photo2.jpg" alt="moment2" />
      <img src="photo3.jpg" alt="moment3" />
    </div>
  </div>

  <script>
    function updateTimer() {
      // Relationship start date
      const startDate = new Date("2025-06-23T00:00:00");
      const now = new Date();
      const diff = now - startDate;

      const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30.44));
      const days = Math.floor((diff / (1000 * 60 * 60 * 24)) % 30.44);
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      document.getElementById("timer").innerHTML =
        `${months} months, ${days} days, ${hours} hours, ${mins} mins, ${secs} secs 💗`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
